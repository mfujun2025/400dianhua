name: sync-400-numbers

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          BASE_TOKEN: Vugfbq5D9aR7I5sBholcPFJjnEf
          TABLE_ID: tblZ6EyA2BsJBHgW
          OUTPUT_FILE: numbers.js
        run: python3 sync_numbers.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet numbers.js; then
            echo "No changes, skip commit"
          else
            git add numbers.js
            git commit -m "Auto sync 400 numbers"
            git push
            echo "Numbers updated and pushed"
          fi
